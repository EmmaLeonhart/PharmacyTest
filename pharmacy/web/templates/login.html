{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
<form method="post" action="{{ url_for('main.login') }}">
  <label>Username <input name="username" required></label>
  <label>Password <input name="password" type="password" required></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
